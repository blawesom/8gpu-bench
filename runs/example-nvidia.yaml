# Example run manifest: NVIDIA SUT, vLLM, Tier 1 smoke lane (TP1).
# Copy to runs/<sut>-<stack>.yaml and adjust. The runner records the
# resolved image digest at run time (spec 07.4). Pin image tags by
# digest for the campaign (spec 02.2).
#
# Host values are environment placeholders (spec 07.7): the runner
# expands them and aborts on unset variables, so real hostnames never
# enter the repository. Before the run:
#   export SUT1_HOST=sut1-h200
# Real values that cannot be parameterized go into runs/local/
# (gitignored).

run_id_prefix: sut1-vllm
campaign_id: 2026Q4
sut: SUT-1
stack: vllm
stack_version: "0.32.0"        # goes into every record verbatim
model: Qwen/Qwen3.8-27B
model_revision: ""             # HF commit SHA. Fill before the campaign.
served_model_name: Qwen3.8-27B
precision: BF16                # spec 04.1.2: Tier 1 is BF16 for all SUTs
tp: 1
lane: BASE                   # BASE (default) or TUNED (spec 02.4.1)
comparability: STRICT          # spec 04.1.6: STRICT / ARCH / HWBEST
repetitions: 5                 # spec 05.4: 5 core, 7 Tier 2 headline
seed: 42
flags: [PILOT]                  # extra flags recorded on every row

# Drift detection (spec 05.2.2): the runner runs this point before
# the first test point, after every 10 test points, and at the end.
# Records carry the REFERENCE flag and feed the V8 check.
reference:
  profile: PF-1
  scenario: P-U
  regime: W-ON
  concurrency: [32]
  requests: 200
  warmup_requests: 50
reference_every: 10

server:
  image: vllm/vllm-openai:v0.32.0
  port: 8000
  container_port: 8000
  shm_size: 64g
  mounts:
    - /opt/models:/models:ro
  # Placement (spec 03.2): the runner runs on the client and controls
  # the SUT container through Docker over SSH (spec 07.7: the host
  # comes from the environment).
  docker_host: ssh://bench@${SUT1_HOST}
  # NVIDIA: --gpus. Omit for AMD and Intel.
  # Tier 1 is TP=1: pin the container to one GPU.
  gpus: device=0
  # Telemetry is sliced to these GPUs (spec 06.6): idle GPUs must
  # not dilute power, utilization and memory (review defect 5).
  # TP=8 manifests leave gpu_ids out (all GPUs).
  gpu_ids: [0]
  # Baseline server config (spec 02.4). Prefix cache is off because
  # the test points use the unique-prompt scenario P-U. Remove this
  # flag for P-S and P-C points.
  args: >-
    --model /models/Qwen3.8-27B
    --served-model-name Qwen3.8-27B
    --dtype bfloat16
    --max-num-seqs 256
    --gpu-memory-utilization 0.90
    --no-enable-prefix-caching

client:
  target: http://${SUT1_HOST}:8000   # dedicated client machine (spec 03.2)
  guidellm: /opt/8gpu-bench/harness/venv/bin/guidellm
  genai_perf: /opt/8gpu-bench/harness/venv/bin/genai-perf

test_points:
  # TP1: Tier 1, PF-1, P-U, W-ON, all concurrency values (spec 04.4).
  - profile: PF-1
    scenario: P-U
    regime: W-ON
    concurrency: [1, 2, 4, 8, 16, 32, 64, 128, 256]
    requests: 1000
    warmup_requests: 100

  # OPEN lane (spec 03.3): Poisson arrivals at a fixed request rate.
  # Runs on the primary harness only. Rates reuse the concurrency
  # value list.
  - profile: PF-1
    scenario: P-U
    regime: W-ON
    mode: OPEN
    rate: [8, 32, 128]
    requests: 1000
    warmup_requests: 100
