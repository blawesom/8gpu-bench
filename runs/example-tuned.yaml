# Example run manifest: CFG-TUNED lane (spec 02.4.1).
# The tuned lane runs the vendor best-known configuration: DP
# attention, expert parallelism, custom kernels. It runs the same
# payload profiles, request counts and concurrency list as CFG-BASE.
# Only the server configuration changes.
#
# Rules:
#   - Every row is flagged TUNED and never compared with CFG-BASE rows.
#   - The full server settings are recorded in meta.json.
#   - Run the matching CFG-BASE manifest first: a TUNED result
#     without the BASE result is incomplete.

run_id_prefix: sut1-vllm-tuned
campaign_id: 2026Q4
sut: SUT-1
stack: vllm
stack_version: "0.32.0"
model: deepseek-ai/DeepSeek-V4.1-Flash
model_revision: ""
served_model_name: DeepSeek-V4.1-Flash
precision: FP8
tp: 8
lane: TUNED
comparability: STRICT          # spec 04.1.6: the Tier 2 headline model
repetitions: 7                 # spec 05.4: Tier 2 headline points
seed: 42
flags: [PILOT]

server:
  image: vllm/vllm-openai:v0.32.0
  port: 8000
  container_port: 8000
  shm_size: 64g
  mounts:
    - /opt/models:/models:ro
  # Placement (spec 03.2): Docker over SSH to the SUT.
  docker_host: ssh://bench@sut1
  # TP=8: all GPUs. No gpu_ids: the telemetry slice uses all 8.
  gpus: all
  # Vendor best-known config. Record every flag here: this block is
  # the TUNED lane definition. Example shape for a MoE model.
  # FP8 is a quantization in vLLM, not a --dtype value.
  # PILOT-VERIFY the DP-attention flag names at the version pin
  # (--dp-size was renamed --data-parallel-size upstream).
  args: >-
    --model /models/DeepSeek-V4.1-Flash
    --served-model-name DeepSeek-V4.1-Flash
    --quantization fp8
    --enable-dp-attention
    --data-parallel-size 8
    --enable-expert-parallel

client:
  target: http://sut1:8000
  guidellm: /opt/8gpu-bench/harness/venv/bin/guidellm
  genai_perf: /opt/8gpu-bench/harness/venv/bin/genai-perf

test_points:
  # Same test points as the CFG-BASE manifest of this SUT and stack.
  - profile: PF-1
    scenario: P-U
    regime: W-ON
    concurrency: [1, 2, 4, 8, 16, 32, 64, 128, 256]
    requests: 1000
    warmup_requests: 100
