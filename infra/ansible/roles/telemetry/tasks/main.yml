---
# 1 Hz power/thermal sampler (spec 06.6, metrics M15 to M19).
# Runs as a systemd service. Writes one CSV per day.

- name: Create the telemetry output directory
  ansible.builtin.file:
    path: "{{ telemetry_output_dir }}"
    state: directory
    mode: "0755"

- name: Install the sampler script
  ansible.builtin.template:
    src: gpu-telemetry.sh.j2
    dest: /usr/local/bin/gpu-telemetry.sh
    mode: "0755"

- name: Install the systemd unit
  ansible.builtin.template:
    src: gpu-telemetry.service.j2
    dest: /etc/systemd/system/gpu-telemetry.service
    mode: "0644"
  notify: Restart gpu-telemetry

- name: Enable and start the sampler
  ansible.builtin.systemd:
    name: gpu-telemetry
    state: started
    enabled: true
    daemon_reload: true

# The runner runs on the client (spec 03.2) and slices the telemetry
# from a read-only NFS share of this directory. Set
# telemetry_export_net in group_vars to the client network CIDR.
# Empty disables the export (run --telemetry with a shared mount
# instead).
- name: Install the NFS server for the telemetry export
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present
    update_cache: true
  when: telemetry_export_net | length > 0

- name: Export the telemetry directory read-only to the client network
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: "{{ telemetry_output_dir }} {{ telemetry_export_net }} ro,sync,no_subtree_check"
    create: true
    mode: "0644"
  when: telemetry_export_net | length > 0
  notify: Restart nfs-kernel-server

- name: Enable and start the NFS server
  ansible.builtin.systemd:
    name: nfs-kernel-server
    state: started
    enabled: true
  when: telemetry_export_net | length > 0
