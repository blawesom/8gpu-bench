---
# Docker Engine plus vendor GPU passthrough (spec 02.2, 02.3).

# Docker packages are not in the Ubuntu archives. Add the upstream
# apt repository first, then install the version pin.
- name: Add the Docker apt repository GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpgkey
    dest: /usr/share/keyrings/docker-archive-keyring.gpg
    mode: "0644"

- name: Add the Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/docker-archive-keyring.gpg]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install the version-pinned Docker Engine
  ansible.builtin.apt:
    name:
      # docker_apt_version is pinned in group_vars. Empty means latest.
      - "docker-ce{{ docker_apt_version }}"
      - "docker-ce-cli{{ docker_apt_version }}"
      - "containerd.io{{ docker_apt_version }}"
    state: present
    update_cache: true
  register: docker_install

- name: Add the benchmark user to the docker group
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true

- name: Start and enable Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

# --------------------------------------------------- NVIDIA passthrough
- name: Install the NVIDIA container toolkit
  when: gpu_vendor is defined and gpu_vendor == "nvidia"
  block:
    - name: Add the container toolkit repo key
      ansible.builtin.get_url:
        url: https://nvidia.github.io/libnvidia-container/gpgkey
        dest: /usr/share/keyrings/nvidia-container-toolkit-keyring.asc
        mode: "0644"

    - name: Add the container toolkit repo
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.asc]
          https://nvidia.github.io/libnvidia-container/stable/deb/{{ ansible_distribution_release }} {{ ansible_distribution_release }}
        filename: nvidia-container-toolkit
        state: present

    - name: Install the toolkit
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: true

    - name: Configure Docker with the nvidia runtime
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "runtimes": {
              "nvidia": {
                "path": "nvidia-container-runtime",
                "runtimeArgs": []
              }
            }
          }
      notify: Restart docker

    - name: Verify GPU passthrough with a CUDA container
      ansible.builtin.command: >-
        docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu24.04 nvidia-smi -L
      register: cuda_check
      changed_when: false
      failed_when: cuda_check.rc != 0 or (cuda_check.stdout_lines | length) != 8

# --------------------------------------------------- AMD passthrough
- name: Verify AMD GPU device nodes for containers
  when: gpu_vendor is defined and gpu_vendor == "amd"
  block:
    - name: Check /dev/kfd exists
      ansible.builtin.stat:
        path: /dev/kfd
      register: kfd

    - name: Assert /dev/kfd is present
      ansible.builtin.assert:
        that: kfd.stat.exists
        fail_msg: "/dev/kfd missing. ROCm driver not loaded."

    - name: Check /dev/dri render nodes
      ansible.builtin.command: ls /dev/dri/by-path/
      register: dri_nodes
      changed_when: false

    - name: Assert 8 render nodes exist
      ansible.builtin.assert:
        that: (dri_nodes.stdout_lines | select('search', 'render') | list | length) == 8
        fail_msg: "Expected 8 render nodes. Found: {{ dri_nodes.stdout_lines }}"
