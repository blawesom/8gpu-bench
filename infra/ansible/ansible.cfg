# 8gpu-bench node environment bring-up.
# Usage:
#   ansible-playbook playbooks/site.yml    # full bring-up
#   ansible-playbook playbooks/verify.yml  # entry criteria (spec 01.3)
#   ansible-playbook playbooks/record.yml  # refresh environment record

[defaults]
inventory = inventory
host_key_checking = True
forks = 10
timeout = 30
interpreter_python = auto_silent
stdout_callback = yaml
callbacks_enabled = timer

[ssh_connection]
pipelining = True
