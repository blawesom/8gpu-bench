# Inventory: one host per SUT (spec 01) plus the load client (spec 03.2).
# Set ansible_host and BMC addresses per site before use. Committed
# examples use the documentation range 192.0.2.0/24 (spec 07.7): real
# site addresses must not be committed; the CI hygiene job fails on
# private IPv4 ranges.

all:
  children:
    nvidia:
      hosts:
        sut1-h200:
          # ansible_host: 192.0.2.11
          sut_id: SUT-1
          gpu_model: H200
          gpu_memory_gb: 141
          liquid_cooled: false
        sut2-b300:
          # ansible_host: 192.0.2.12
          sut_id: SUT-2
          gpu_model: B300
          gpu_memory_gb: 288
          liquid_cooled: true
        sut3-rtx6000:
          # ansible_host: 192.0.2.13
          sut_id: SUT-3
          gpu_model: RTX PRO 6000 Blackwell Server Edition
          gpu_memory_gb: 96
          liquid_cooled: false
    amd:
      hosts:
        sut4-mi300x:
          # ansible_host: 192.0.2.21
          sut_id: SUT-4
          gpu_model: MI300X
          gpu_memory_gb: 192
          liquid_cooled: false
        sut5-mi355x:
          # ansible_host: 192.0.2.22
          sut_id: SUT-5
          gpu_model: MI355X
          gpu_memory_gb: 288
          liquid_cooled: true
        sut6-mi450:
          # ansible_host: 192.0.2.23
          sut_id: SUT-6
          gpu_model: MI455X
          gpu_memory_gb: 432
          liquid_cooled: true
          pilot: true
    intel:
      hosts:
        sut7-d270:
          # ansible_host: 192.0.2.31
          sut_id: SUT-7
          gpu_model: D270
          gpu_memory_gb: 160
          liquid_cooled: false
          pilot: true
    client:
      hosts:
        bench-client:
          # ansible_host: 192.0.2.2
          client_id: CLIENT-1
