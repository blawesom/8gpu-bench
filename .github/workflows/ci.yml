name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install --quiet pyyaml jsonschema

      - name: Syntax check
        run: |
          python -m py_compile tools/gen-corpus.py tools/run-benchmark.py tools/build-results.py
          bash -n tools/s3sync.sh

      - name: Corpus generator selftest
        run: python tools/gen-corpus.py selftest

      - name: Runner selftest (order, schedule, manifest checks)
        run: python tools/run-benchmark.py selftest

      - name: Assembler selftest (stats, validity, drift, schemas)
        run: python tools/build-results.py selftest

      - name: Validate the example run manifests
        # Placeholder hosts (spec 07.7): the loader expands them from
        # the environment; an unset variable would fail here.
        env:
          SUT1_HOST: sut1.example.invalid
          SUT4_HOST: sut4.example.invalid
        run: |
          python - <<'EOF'
          import importlib.util
          spec = importlib.util.spec_from_file_location(
              "rb", "tools/run-benchmark.py")
          rb = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(rb)
          import glob
          for path in sorted(glob.glob("runs/*.yaml")):
              cfg = rb.load_manifest(path)
              if "${" in str(cfg):
                  raise SystemExit(f"{path}: unresolved placeholder")
              problems = rb.validate_manifest(cfg)
              if problems:
                  raise SystemExit(f"{path}: {problems}")
              print(f"ok: {path}")
          EOF

  hygiene:
    # Spec 07.7: the repo holds setup only. Fail on secrets, private
    # addresses, real ssh targets, and store URIs in committed files.
    # ${VAR} placeholders are allowed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan committed files for secrets and private data
        run: |
          python - <<'EOF'
          import pathlib, re, sys
          patterns = {
              "access-key-like string (AKIA/ASIA...)": re.compile(r"\b(AKIA|ASIA)[0-9A-Z]{16}\b"),
              # Jinja placeholders ({{ ... }}) in templates are fine;
              # a literal value after the equals sign is a leak.
              "s3cmd secret_key with a literal value": re.compile(r"^\s*secret_key\s*=\s*(?!\{\{)\S", re.M),
              "s3cmd access_key with a literal value": re.compile(r"^\s*access_key\s*=\s*(?!\{\{)\S", re.M),
              "private key block": re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              "private IPv4 range": re.compile(r"\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b"),
              # Dotless inventory names (sut1, sut1-h200) and ${...}
              # placeholders are allowed; a dotted host is an FQDN/IP.
              "ssh target with a dotted host (FQDN/IP)": re.compile(r"ssh://[^@/\s]+@[A-Za-z0-9-]+\.[A-Za-z0-9.-]+"),
              "s3 URI with a bucket name": re.compile(r"s3://[A-Za-z0-9][A-Za-z0-9.-]*/"),
          }
          skip = {".git", "__pycache__"}
          failures = []
          for path in sorted(pathlib.Path(".").rglob("*")):
              if not path.is_file() or any(p in skip for p in path.parts):
                  continue
              if path.stat().st_size > 1_000_000:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, ValueError):
                  continue
              for name, rx in patterns.items():
                  for m in rx.finditer(text):
                      line = text.count("\n", 0, m.start()) + 1
                      failures.append(f"{path}:{line}: {name}: {m.group(0)[:40]}")
          if failures:
              print("hygiene scan FAILED (spec 07.7):")
              for f in failures:
                  print(f"  {f}")
              sys.exit(1)
          print("hygiene scan passed: no secrets, private IPs, real hosts, or store URIs")
          EOF
